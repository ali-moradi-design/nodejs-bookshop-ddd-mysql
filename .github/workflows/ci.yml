name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bookstore_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Migrate
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/bookstore_ci

      - name: Test
        run: npm test
        env:
          JWT_ACCESS_SECRET: ci-access-secret-min-8
          JWT_REFRESH_SECRET: ci-refresh-secret-min-8
          NODE_ENV: test
          TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/bookstore_ci
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/bookstore_ci
